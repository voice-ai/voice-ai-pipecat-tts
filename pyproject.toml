[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-voice-ai"
version = "1.0.0"
description = "Voice.AI TTS service integration for Pipecat"
authors = [{name = "Voice.AI", email = "support@voice.ai"}]
requires-python = ">=3.9"
dependencies = [
    "pipecat-ai>=0.0.101",
    "websockets>=14.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
